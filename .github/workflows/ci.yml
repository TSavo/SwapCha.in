name: CI
on:
  push: { branches: [main, v2, "v2-*"] }
  pull_request:
# Read-only token for every job (fork PRs never get secrets or a write token). Checked by scripts/ci-fork-check.py.
permissions:
  contents: read
jobs:
  ci:
    # Self-hosted Battleaxe runner only for pushes and same-repo PRs; fork PRs stay GitHub-hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","swapchan"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      # Fork-PR routing + read-only token, evaluated per event, with negative tests (ported from blocktools 127b5f9).
      - run: sh scripts/ci-fork-check-negatives.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
