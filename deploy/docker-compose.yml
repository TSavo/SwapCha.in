# SwapChan on Battleaxe. Deployed from the Mac with deploy/deploy.sh (docker context: battleaxe).
# Public only through the Cloudflare tunnel "swapchan" (remotely managed; ingress lives in Cloudflare):
#   swapchan.com, www -> web:3000   api.swapchan.com -> api:8787   mcp.swapchan.com -> mcp:8788
# Nothing is published on Battleaxe except the 127.0.0.1 ports below.
name: swapchan

services:
  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: swapchan-api:latest
    restart: unless-stopped
    environment: # unset keys = that provider/feature self-disables
      TZ: America/Los_Angeles
      # getaddrinfo runs on libuv's threadpool (default 4): under concurrent scans every outbound
      # connection queued behind DNS, so all hosts looked slow at ~4% CPU.
      UV_THREADPOOL_SIZE: "64"
      SWAPCHAN_INTERNAL_KEY: ${SWAPCHAN_INTERNAL_KEY:-} # proves MCP->API calls; unset = x-swapchan-client-ip ignored
      # scan concurrency gate (scanctx.gate); 8 overloads the public RPCs (every scan hits 17s), 4 holds ~15s
      FIND_MAX_CONCURRENT: ${FIND_MAX_CONCURRENT:-4}
      ZEROX_API_KEY: ${ZEROX_API_KEY:-}
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      LIFI_INTEGRATOR: ${LIFI_INTEGRATOR:-myswapchan}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      CRYPTOID_API_KEY: ${CRYPTOID_API_KEY:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      SWAPCHAN_FEE_RECIPIENT_SOLANA: ${SWAPCHAN_FEE_RECIPIENT_SOLANA:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      VELORA_API_KEY: ${VELORA_API_KEY:-}
      ONEINCH_API_KEY: ${ONEINCH_API_KEY:-} # business.1inch.com; unset = 1inch off
      THORCHAIN_AFFILIATE: ${THORCHAIN_AFFILIATE:-} # registered THORName; unset = THORChain routes fee-free
      DEBRIDGE_REFERRAL_CODE: ${DEBRIDGE_REFERRAL_CODE:-}
      SWAPCHAN_FEE_RECIPIENT: ${SWAPCHAN_FEE_RECIPIENT:-}
      SWAPCHAN_FEE_BPS: ${SWAPCHAN_FEE_BPS:-0}
      SWAPCHAN_LIFI_FEE: ${SWAPCHAN_LIFI_FEE:-} # 1 once portal.li.fi has the fee wallet
      SWAPCHAN_API_KEYS: ${SWAPCHAN_API_KEYS:-} # empty = API open (for now)
      SWAPCHAN_DATA_DIR: /data # widget partners SQLite (partners.db) + smart-wallet sessions.db
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-} # smart-wallet agent; unset = agent disabled, /chat stream still mounts
      SWAPCHAN_AGENT_MODEL: ${SWAPCHAN_AGENT_MODEL:-} # smart-wallet agent model; unset = SDK default
      SWAPCHAN_MCP_URL: ${SWAPCHAN_MCP_URL:-http://mcp:8788/mcp} # the agent's tools (internal MCP)
      SWAPCHAN_CHAT_RATE_PER_MIN: ${SWAPCHAN_CHAT_RATE_PER_MIN:-2} # smart-wallet messages per minute per address
      NODE_ENV: production # SmartWallet cookie is Secure + Domain-scoped only in production
      SWAPCHAN_SESSION_SECRET: ${SWAPCHAN_SESSION_SECRET:-} # HMAC key for the sign-to-view session cookie (required in prod)
      SWAPCHAN_COOKIE_DOMAIN: ${SWAPCHAN_COOKIE_DOMAIN:-} # e.g. .swapchan.com — spans web + api subdomains
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-} # getAssetTransfers discovery on Base/Arbitrum; unset = those chains unscanned
      SWAPCHAN_PARTNER_SHARE_BPS: ${SWAPCHAN_PARTNER_SHARE_BPS:-5000} # partner share of our fee (5000 = 50%)
    volumes: ["api-data:/data"]
    ports: ["127.0.0.1:8787:8787"]
    # /healthz is 503 when scans time out en masse, heap nears the limit, or the event loop stalls.
    # Compose does not restart on "unhealthy"; the in-process watchdog exits after ~2 min unhealthy and
    # restart: unless-stopped brings up a clean process. This healthcheck makes the state visible in `docker ps`.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.swapchan.com
        NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    image: swapchan-web:latest
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      SWAPCHAN_API_URL: http://api:8787 # server-side rendering talks to the api inside the compose network
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
  mcp:
    build: { context: .., dockerfile: apps/mcp/Dockerfile }
    image: swapchan-mcp:latest
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      SWAPCHAN_API_URL: http://api:8787
      MCP_API_KEYS: ${MCP_API_KEYS:-}
      SWAPCHAN_INTERNAL_KEY: ${SWAPCHAN_INTERNAL_KEY:-} # same value as api; unset = MCP callers share one API rate bucket
      MCP_ALLOW_ANONYMOUS: ${MCP_ALLOW_ANONYMOUS:-0} # deploy.sh sets 1 when no MCP keys are configured
    ports: ["127.0.0.1:8788:8788"]
    depends_on: [api]
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [web, api, mcp]

volumes:
  api-data:
